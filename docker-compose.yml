services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blue_spring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blue_spring"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/blue_spring
      JWT_SECRET: ${JWT_SECRET:?set a 32+ character JWT_SECRET}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
